<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <!-- Top-left highlight sheen on the prism -->
    <linearGradient id="exSheen" x1="60" y1="35" x2="110" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- Envelope body: dimensional blue -->
    <linearGradient id="exBody" x1="55" y1="86" x2="145" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f4f9ff"/>
      <stop offset="1" stop-color="#cfe2ff"/>
    </linearGradient>
    <!-- Envelope flap: darker so it reads as folded over -->
    <linearGradient id="exFlap" x1="55" y1="86" x2="145" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5a9bf5"/>
      <stop offset="1" stop-color="#2f6fd6"/>
    </linearGradient>
    <!-- Right (shaded) face of the pyramid -->
    <linearGradient id="exFaceR" x1="100" y1="60" x2="180" y2="185" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9cc2f9"/>
      <stop offset="1" stop-color="#5a93e6"/>
    </linearGradient>
    <!-- Left (lit) face of the pyramid -->
    <linearGradient id="exFaceL" x1="20" y1="185" x2="100" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d4e6ff"/>
      <stop offset="1" stop-color="#eef5ff"/>
    </linearGradient>
    <!-- Soft drop shadow to lift the icon off the surface -->
    <filter id="exShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#1e3a8a" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- Scale the whole glyph down within the 200x200 viewBox so it visually matches the padding
       of the other dashboard tile icons (which render at the same 80x80 box). -->
  <g transform="translate(100 100) scale(0.82) translate(-100 -100)">
  <!-- 3D glass pyramid: base is a shallow V (front edge dips at center) -->
  <g filter="url(#exShadow)">
    <!-- Left front face: apex -> left base corner -> center front (low) -->
    <path d="M100 20 L20 170 L100 182 Z" fill="url(#exFaceL)"/>
    <!-- Right front face: apex -> center front (low) -> right base corner -->
    <path d="M100 20 L100 182 L180 170 Z" fill="url(#exFaceR)"/>
    <!-- Center ridge from apex down to the low front point -->
    <path d="M100 20 L100 182" stroke="#2563eb" stroke-width="4" stroke-opacity="0.55" fill="none"/>
    <!-- Outer silhouette: left side, chevron base (dips to 100,182), right side -->
    <path d="M100 20 L20 170 L100 182 L180 170 Z" stroke="#2563eb" stroke-width="8" stroke-linejoin="round" stroke-linecap="round" fill="none"/>
    <!-- Top-left sheen -->
    <path d="M100 38 L34 162 L100 172 Z" fill="url(#exSheen)"/>
  </g>

  <!-- Dimensional envelope glyph -->
  <g filter="url(#exShadow)">
    <!-- Body -->
    <rect x="55" y="86" width="90" height="62" rx="11" fill="url(#exBody)" stroke="#2563eb" stroke-width="5"/>
    <!-- Folded flap (front) -->
    <path d="M58 92 L100 124 L142 92" fill="none" stroke="url(#exFlap)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Flap highlight -->
    <path d="M61 94 L100 124 L139 94" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  </g>
</svg>
