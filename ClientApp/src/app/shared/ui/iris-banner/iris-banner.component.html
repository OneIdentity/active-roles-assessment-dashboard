@if (!hidden()) {
  <div
    class="banner"
    [class.banner--info]="type === 'info'"
    [class.banner--warning]="type === 'warning'"
    [class.banner--error]="type === 'error'"
    [class.banner--success]="type === 'success'"
    [class.banner--colored]="colored"
    [attr.role]="role"
  >
    <iris-icon class="banner-icon" [name]="iconName" size="20px" />
    <div class="banner-content">
      @if (title) {
        <p class="banner-title">{{ title }}</p>
      }
      @if (supportingText) {
        <p class="banner-supporting-text">{{ supportingText }}</p>
      }
      @if (showActions && (primaryActionLabel || secondaryActionLabel)) {
        <div class="banner-actions">
          @if (primaryActionLabel) {
            <button class="banner-action banner-action--primary" type="button" (click)="primaryActionClick.emit()">
              {{ primaryActionLabel }}
            </button>
          }
          @if (secondaryActionLabel) {
            <button class="banner-action" type="button" (click)="secondaryActionClick.emit()">
              {{ secondaryActionLabel }}
            </button>
          }
        </div>
      }
    </div>
    @if (dismissable) {
      <button
        class="banner-dismiss"
        type="button"
        [attr.aria-label]="dismissAriaLabel"
        (click)="dismiss()"
      >
        <iris-icon name="X" size="16px" />
      </button>
    }
  </div>
}
