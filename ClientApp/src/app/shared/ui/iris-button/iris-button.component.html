<button
  [type]="type"
  [disabled]="disabled"
  class="btn"
  [class.size_s]="size === 's'"
  [class.size_default]="size === 'default'"
  [class.size_l]="size === 'l'"
  [class.variant_primary]="variant === 'primary'"
  [class.variant_secondary]="variant === 'secondary'"
  [class.variant_danger]="variant === 'danger'"
  [class.full_width]="fullWidth"
>
  <span class="label"><ng-content></ng-content></span>
</button>
