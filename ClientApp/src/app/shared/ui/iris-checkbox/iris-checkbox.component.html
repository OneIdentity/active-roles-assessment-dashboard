<label class="iris-checkbox">
  <span class="iris-checkbox__wrap">
    <input
      type="checkbox"
      class="iris-checkbox__input"
      [checked]="checked"
      [disabled]="disabled"
      [attr.aria-label]="ariaLabel || null"
      (change)="toggle($any($event.target).checked)"
    />
    <span class="iris-checkbox__box" [class.is-checked]="checked" aria-hidden="true">
      <svg viewBox="0 0 16 16" class="iris-checkbox__mark">
        <path
          class="iris-checkbox__check-path"
          d="M3.5 8.5l3 3 6-6"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          fill="none"
        />
      </svg>
    </span>
  </span>
  <span class="iris-checkbox__label"><ng-content></ng-content></span>
</label>
