<div class="field">
  @if (label) {
    <label class="label" [attr.for]="for">
      {{ label }}
      @if (required) {
        <span class="required" aria-hidden="true">*</span>
      }
    </label>
  }
  <div class="control">
    <ng-content></ng-content>
  </div>
  @if (error) {
    <p class="error" role="alert">{{ error }}</p>
  }
</div>
